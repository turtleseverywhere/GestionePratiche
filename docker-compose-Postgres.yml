version: '3.4'
name: gestione_pratiche
services:
  gestione_pratiche_postgres:
    image: "postgres:16.1-alpine3.18"
    container_name: gestione_pratiche_postgres
    volumes:
      - gestione_pratiche_postgres_data:/var/lib/postgresql/data
      - ./var/database/postgres/AuthDB_Postgres.sql:/docker-entrypoint-initdb.d/AuthDB_Postgres.sql
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=AuthDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
  #   container_name: gestione_pratiche_elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #   volumes:
  #     - gestione_pratiche_elastic_data:/usr/share/elasticsearch/data
  #   ports:
  #     - 9200:9200
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 20

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:7.17.24
  #   container_name: gestione_pratiche_kibana
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   ports:
  #     - 5601:5601
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy

  sistema_gestione_pratiche:
    image: sistema_gestione_pratiche
    container_name: sistema_gestione_pratiche
    build:
      context: ./sistema_gestione_pratiche
      dockerfile: ./Dockerfile
    ports:
      - 5179:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=Logs\\Logs.txt
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp} {Message}{NewLine:1}{Exception:1}
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__2__Name=PostgreSQL
      - Serilog__WriteTo__2__Args__connectionString=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
      - Serilog__WriteTo__2__Args__tableName=Logs
      - Serilog__WriteTo__2__Args__AutoCreateSqlTable=True    
      - Serilog__WriteTo__3__Name=Elasticsearch
      - Serilog__WriteTo__3__Args__nodeUris=http://elasticsearch:9200
      - Serilog__WriteTo__3__Args__indexFormat=x1-lavorazione-pratiche-{0:yyyy.MM.dd}
      - Serilog__WriteTo__3__Args__autoRegisterTemplate=true
      - Serilog__WriteTo__3__Args__autoRegisterTemplateVersion=ESv7
      - Serilog__WriteTo__3__Args__numberOfReplicas=0
      - Serilog__Properties__ApplicationName=sistema_gestione_pratiche
      - ConnectionStrings__AuthDB_Postgres=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
      - ConnectionStrings__DbContext_Postgres=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
      - ExternalServices__X1host=http://x1_lavorazione_pratiche
      - ExternalServices__X1port=8080
    links:
      - gestione_pratiche_postgres
    # depends_on:
    #   elasticsearch:
    #     condition: service_healthy

  x1_lavorazione_pratiche:
    image: x1_lavorazione_pratiche
    container_name: x1_lavorazione_pratiche
    build:
      context: ./x1_lavorazione_pratiche
      dockerfile: ./Dockerfile
    ports:
      - 5180:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=Logs\\Logs.txt
      - Serilog__WriteTo__1__Args__outputTemplate={Timestamp} {Message}{NewLine:1}{Exception:1}
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__2__Name=PostgreSQL
      - Serilog__WriteTo__2__Args__connectionString=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
      - Serilog__WriteTo__2__Args__tableName=Logs
      - Serilog__WriteTo__2__Args__AutoCreateSqlTable=True  
      - Serilog__WriteTo__3__Name=Elasticsearch
      - Serilog__WriteTo__3__Args__nodeUris=http://elasticsearch:9200
      - Serilog__WriteTo__3__Args__indexFormat=sistema-gestione-pratiche-{0:yyyy.MM.dd}
      - Serilog__WriteTo__3__Args__autoRegisterTemplate=true
      - Serilog__WriteTo__3__Args__autoRegisterTemplateVersion=ESv7
      - Serilog__WriteTo__3__Args__numberOfReplicas=0 
      - Serilog__Properties__ApplicationName=x1_lavorazione_pratiche
      - ConnectionStrings__AuthDB_Postgres=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
      - ConnectionStrings__DbContext_Postgres=Server=gestione_pratiche_postgres;Port=5432;Database=AuthDB;UserId=postgres;Password=postgres;
    links:
      - gestione_pratiche_postgres
    # depends_on:
    #   elasticsearch:
    #     condition: service_healthy

  sistema_esterno:
    image: sistema_esterno
    container_name: sistema_esterno
    build:
      context: ./sistema_esterno
      dockerfile: ./Dockerfile
    ports: 
      - 4200:80
    links:
      - sistema_gestione_pratiche


volumes:
  gestione_pratiche_postgres_data:
    name: gestione_pratiche_postgres_data
    driver: local
  gestione_pratiche_elastic_data:
    name: gestione_pratiche_elastic_data
    driver: local